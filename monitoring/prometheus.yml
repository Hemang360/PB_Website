global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:

scrape_configs:
  - job_name: 'pb-website'
    static_configs:
      - targets: ['host.docker.internal:9464']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    scrape_timeout: 10s 