receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  debug:  # ✅ replaces deprecated 'logging'
    verbosity: detailed

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:  # ✅ replaces invalid 'labels'
      exporter: true
      job: true
      instance: true

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: prom

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]  # ✅ switched from logging ➔ debug
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, loki]  # ✅ fixed exporter names
